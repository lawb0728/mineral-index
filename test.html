<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>矿物详情站点测试页</title>
  <style>
    :root { color-scheme: light; --ink:#1f2937; --muted:#64748b; --accent:#176b87; --line:#d9e2ec; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#eef3f6; color:var(--ink); font-family:"Microsoft YaHei",Arial,sans-serif; }
    main { width:min(680px,100%); background:#fff; border:1px solid var(--line); border-radius:18px; padding:32px; box-shadow:0 8px 28px #183b4a22; }
    h1 { margin:0 0 12px; color:var(--accent); font-size:28px; }
    p { line-height:1.8; margin:10px 0; }
    .ok { margin:22px 0; padding:16px 18px; border-radius:10px; background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; font-weight:600; }
    code { background:#f1f5f9; padding:2px 6px; border-radius:4px; word-break:break-all; }
    .foot { color:var(--muted); font-size:13px; margin-top:24px; }
    .qr { display:block; width:180px; height:180px; margin:20px auto 4px; image-rendering:pixelated; }
    .qr-caption { text-align:center; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main>
    <h1>矿物详情站点测试页</h1>
    <p>这是 GitHub Pages 发布测试页面，不包含任何矿物详情、图片、CIF 文件或平台资料。</p>
    <div class="ok">如果你能看到本页，说明静态网页已经可以公开访问。</div>
    <p>测试地址：<code>https://lawb0728.github.io/mineral-index/test.html</code></p>
    <p>请使用手机扫描配套二维码，确认手机能够直接打开本页面。</p>
    <img class="qr" src="test-qr.png" alt="测试页二维码">
    <div class="qr-caption">测试页二维码</div>
    <p class="foot">测试通过后，再决定是否上传矿物详情文件。</p>
  </main>
</body>
</html>
